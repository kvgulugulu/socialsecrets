<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111114">
<title>未公开的恋情 · 社交平台调查解谜</title>
<style>
:root{
  --phone-bg:#000;
  --screen:#f5f5f7;
  --ink:#1b1b1f;
  --ink2:#6b6b74;
  --line:#e8e8ec;
  --card:#fff;
  --accent:#e8437a;
  --lock:#c9c9d1;
  --safe-top:44px;
  --safe-bottom:22px;
  --r:14px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(1200px 800px at 15% 0%,#2b2b39 0%,transparent 55%),
    radial-gradient(900px 700px at 100% 100%,#3a2432 0%,transparent 60%),
    #16161c;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;
  overflow:hidden;
}
button{font-family:inherit;border:none;background:none;padding:0;cursor:pointer;color:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:0;height:0}

/* ============ 手机外壳 ============ */
#stage{position:relative;display:flex;align-items:center;justify-content:center}
.phone{
  position:relative;
  width:392px;height:830px;
  border-radius:54px;
  background:linear-gradient(160deg,#3a3a44,#1a1a20 40%,#2a2a33);
  padding:11px;
  box-shadow:
    0 0 0 2px #0c0c10,
    0 40px 90px rgba(0,0,0,.6),
    0 8px 24px rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(255,255,255,.08);
  flex:0 0 auto;
}
.phone::before{
  content:'';position:absolute;right:-3px;top:190px;width:3px;height:96px;
  border-radius:0 3px 3px 0;background:linear-gradient(#4a4a55,#26262e);
}
.phone::after{
  content:'';position:absolute;left:-3px;top:150px;width:3px;height:60px;
  border-radius:3px 0 0 3px;background:linear-gradient(#4a4a55,#26262e);
}
.screen{
  position:relative;width:100%;height:100%;
  border-radius:44px;overflow:hidden;
  background:var(--screen);
  display:flex;flex-direction:column;
  isolation:isolate;
}
/* 灵动岛 */
.dynamic-island{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:112px;height:31px;border-radius:20px;background:#000;z-index:900;
  display:flex;align-items:center;justify-content:flex-end;padding-right:11px;
  pointer-events:none;
}
.dynamic-island i{width:8px;height:8px;border-radius:50%;background:#12141a;box-shadow:inset 0 0 3px #2b3145}
/* 状态栏 */
.statusbar{
  position:relative;z-index:800;flex:0 0 auto;height:var(--safe-top);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px 0 26px;font-size:13px;font-weight:600;letter-spacing:.3px;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);
  background:transparent;transition:color .25s;
}
.statusbar.dark{color:#f8f8fb;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.statusbar.light{color:#141419;text-shadow:none}
.sb-right{display:flex;align-items:center;gap:5px}
.sb-batt{position:relative;width:24px;height:12px;border-radius:3.5px;border:1.4px solid currentColor;opacity:.95}
.sb-batt::after{content:'';position:absolute;right:-3.4px;top:3.2px;width:2px;height:5px;border-radius:0 2px 2px 0;background:currentColor}
.sb-batt i{position:absolute;left:1.6px;top:1.6px;bottom:1.6px;width:70%;border-radius:1.6px;background:currentColor}
.hp-bar{display:flex;align-items:flex-end;gap:1.6px;height:11px}
.hp-bar b{width:2.6px;border-radius:1px;background:currentColor}
.hp-bar b:nth-child(1){height:4px}.hp-bar b:nth-child(2){height:6px}
.hp-bar b:nth-child(3){height:8px}.hp-bar b:nth-child(4){height:11px}

/* ============ 屏幕容器 ============ */
.viewport{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.app-view{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--screen);
  animation:appIn .26s cubic-bezier(.22,.9,.3,1);
}
@keyframes appIn{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:scale(1)}}
.hidden{display:none!important}

/* 通用导航栏 */
.navbar{
  flex:0 0 auto;height:50px;display:flex;align-items:center;gap:8px;
  padding:0 10px;background:#fff;border-bottom:1px solid var(--line);
  position:relative;z-index:20;
}
.navbar .nav-back{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#333;flex:0 0 auto;transition:background .15s;
}
.navbar .nav-back:active{background:#f0f0f3}
.navbar .nav-title{font-size:16.5px;font-weight:600;flex:1;text-align:center;padding-right:38px}
.navbar .home-key{flex:0 0 auto;margin-left:auto}
.navbar .nav-title.left{text-align:left;padding-right:0;padding-left:4px}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:26px}

/* =====================================================================
   顶部安全区：为小红书内置浏览器的宿主按钮预留空间
   —— 关键操作一律不放顶部，这里只做避让，不挤压正文
   ===================================================================== */
.app-view .navbar,
.app-view .pf-header{
  margin-top: max(4px, calc(env(safe-area-inset-top, 0px) * 0.5));
}

/* =====================================================================
   底部三级导航：返回上一级 / 返回桌面 / 当前 APP 菜单
   ===================================================================== */
.botnav{
  flex:0 0 auto;display:flex;align-items:stretch;gap:2px;
  background:#fff;border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  position:relative;z-index:30;
  box-shadow:0 -4px 14px rgba(20,20,35,.05);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:44px;border-radius:10px;color:#5a5a66;background:transparent;
  transition:background .14s,transform .1s;
}
.bn-item:active{background:#f2f2f6;transform:scale(.96)}
.bn-item.off{opacity:.34;pointer-events:none}
.bn-ico{font-size:16px;line-height:1;font-weight:600}
.bn-txt{font-size:10.5px;font-weight:600;letter-spacing:.2px}

/* =====================================================================
   底部弹出面板（APP 菜单 / 搜索面板）
   ===================================================================== */
.sheet{
  position:absolute;inset:0;z-index:880;
  background:rgba(10,10,18,.42);
  display:flex;align-items:flex-end;
  animation:sheetIn .2s ease-out;
}
@keyframes sheetIn{from{opacity:0}to{opacity:1}}
.sheet-box{
  width:100%;background:#fff;border-radius:18px 18px 0 0;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  max-height:80%;overflow-y:auto;
  animation:sheetUp .24s cubic-bezier(.22,.9,.3,1);
}
@keyframes sheetUp{from{transform:translateY(24px)}to{transform:translateY(0)}}
.sheet-title{font-size:12.6px;color:#a3a3af;text-align:center;margin-bottom:8px}
.sheet-item{
  display:block;width:100%;height:48px;border-radius:12px;background:#f6f6f9;
  font-size:15px;font-weight:600;color:#2b2b33;margin-bottom:8px;
}
.sheet-item:active{background:#eaeaef}
.sheet-item.cancel{background:transparent;color:#8b8b96;font-weight:500;margin-bottom:0}

/* 上下文菜单（复制） */
.ctxmenu{
  position:absolute;z-index:895;background:#fff;border-radius:12px;
  box-shadow:0 10px 30px rgba(12,12,24,.28);overflow:hidden;
  border:1px solid #ececf2;min-width:118px;
  animation:ctxIn .14s ease-out;
}
@keyframes ctxIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.ctx-item{
  display:block;width:100%;padding:12px 18px;font-size:14.4px;font-weight:600;
  color:#22222a;background:#fff;text-align:left;
}
.ctx-item:active{background:#f2f2f6}
.ctx-item.cancel{color:#9a9aa6;font-weight:500;border-top:1px solid #f2f2f6}

/* 可复制文本 */
.copyable{
  color:#2f6fd0;font-weight:700;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:3px;
}

/* 搜索面板 */
.sheet.search .sheet-box{padding-top:16px}
.sp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sp-q{font-size:14.6px;font-weight:700;color:#1d1d24}
.sp-cancel{font-size:13.6px;color:#8b8b96;padding:4px 6px}
.sp-input{
  display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;
  background:#f4f4f8;padding:0 12px;border:1px solid transparent;
}
.sp-input:focus-within{border-color:#d6d6e2;background:#fff}
.sp-ico{font-size:15px;color:#a3a3af}
.sp-input input{
  flex:1;border:0;background:transparent;font-size:14.4px;color:#1d1d24;
  font-family:var(--font);outline:none;min-width:0;
}
.sp-input input::placeholder{color:#b0b0bc}
.sp-paste{
  font-size:10px;font-weight:700;color:#fff;background:#5b6ee1;
  padding:5px 6px;border-radius:8px;flex:0 0 auto;
}
.sp-sub{font-size:11.6px;color:#a3a3af;margin:14px 0 7px}
.sp-clip{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:12px 13px;border-radius:12px;background:#f0f2ff;
  border:1px solid #dde2ff;text-align:left;
}
.sp-clip-t{font-size:14px;font-weight:700;color:#3b4bb5;word-break:break-all}
.sp-clip-go{font-size:11.4px;color:#7b86c9;flex:0 0 auto}
.sp-empty{font-size:12.4px;color:#b0b0bc;padding:9px 2px}
.sp-hist{display:flex;flex-wrap:wrap;gap:7px}
.sp-chip{
  padding:7px 11px;border-radius:16px;background:#f4f4f8;font-size:12.4px;
  color:#4a4a53;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sp-chip:active{background:#e8e8ef}
.sp-chip.sug{background:#fff5f8;color:#c0396b;font-weight:600}
.sp-go{margin-top:16px}

/* 搜索结果页 */
.sr-bar{
  padding:12px 15px;background:#fff;border-bottom:1px solid var(--line);
  font-size:13.2px;color:#6b6b74;
}
.sr-bar b{color:#1d1d24}
.sr-like{
  display:flex;gap:16px;padding:9px 15px;background:#fff;border-bottom:1px solid var(--line);
  font-size:12.4px;color:#8b8b96;
}
.sr-note{
  padding:10px 15px;background:#fffdf3;color:#8a7433;font-size:12.2px;line-height:1.6;
  border-bottom:1px solid var(--line);
}
.sr-note b{color:#6b5a1f}
.sr-item{
  display:flex;gap:11px;align-items:center;background:#fff;
  padding:13px 15px;border-bottom:1px solid var(--line);
}
.sr-item[data-sritem]{cursor:pointer}
.sr-item[data-sritem]:active{background:#f7f7fa}
.sr-av{
  width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
}
.sr-main{flex:1;min-width:0}
.sr-t{font-size:14.4px;font-weight:600;color:#22222a;line-height:1.4}
.sr-s{font-size:11.8px;color:#9a9aa6;margin-top:4px;line-height:1.5}
.sr-tag{
  font-size:10.6px;font-weight:700;color:#c0396b;background:#fff0f5;
  padding:3px 7px;border-radius:8px;flex:0 0 auto;
}
.sr-none{padding:44px 20px;text-align:center;color:#b0b0bc;font-size:13.4px}

/* =====================================================================
   微信新消息：顶部下拉横幅通知
   ===================================================================== */
.notif{
  position:absolute;left:10px;right:10px;top:0;z-index:900;
  background:rgba(252,252,254,.97);
  border-radius:16px;padding:11px 13px;
  box-shadow:0 10px 30px rgba(12,12,24,.24);
  display:flex;gap:10px;align-items:center;
  transform:translateY(-130%);
  transition:transform .38s cubic-bezier(.2,.9,.3,1);
  border:1px solid rgba(0,0,0,.05);
}
.notif.in{ transform:translateY(calc(max(8px, env(safe-area-inset-top, 0px)) + 6px)); }
.notif .nf-av{width:38px;height:38px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#5fd68f,#33a866);color:#fff;font-weight:700;font-size:17px}
.notif .nf-main{flex:1;min-width:0}
.notif .nf-t{font-size:13px;font-weight:700;color:#1d1d24;display:flex;align-items:center;gap:6px}
.notif .nf-t span{font-size:10.4px;color:#a3a3af;font-weight:500}
.notif .nf-b{font-size:12.6px;color:#5a5a66;margin-top:3px;line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.notif .nf-app{font-size:10.4px;color:#a3a3af;flex:0 0 auto;align-self:flex-start}

/* ============ 桌面 ============ */
.desktop{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:
    radial-gradient(1000px 620px at 12% 4%,#5c4b7d 0%,transparent 58%),
    radial-gradient(900px 700px at 108% 12%,#8e4a63 0%,transparent 55%),
    radial-gradient(760px 620px at 50% 108%,#2c4a63 0%,transparent 60%),
    linear-gradient(170deg,#191a26 0%,#101018 55%,#0b0b11 100%);
  color:#fff;
  padding:calc(4px + max(6px, env(safe-area-inset-top, 0px))) 24px calc(26px + env(safe-area-inset-bottom, 0px));
}
.desk-clock{padding:16px 4px 2px}
.desk-clock .big{font-size:56px;font-weight:250;letter-spacing:-2px;line-height:1;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.desk-clock .sub{font-size:13px;opacity:.72;margin-top:6px;font-weight:500}
/* 2 行 × 4 列；图标群 + 记录条共同吸收中部空白，dock 固定在底部 */
.desk-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:22px 10px;margin-top:34px;
  align-content:start;
  flex:0 0 auto;
}
.appicon{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .16s}
.appicon:active{transform:scale(.9)}
.appicon .ico{
  position:relative;width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:26px;line-height:1;overflow:hidden;
  box-shadow:0 6px 14px rgba(0,0,0,.36),inset 0 0 0 1px rgba(255,255,255,.13);
}
.appicon .lbl{
  font-size:11px;line-height:1.25;color:#fff;opacity:.94;letter-spacing:.2px;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
  max-width:66px;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.appicon .badge{
  position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:#fa3b4c;
  color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  padding:0 5px;box-shadow:0 0 0 2px rgba(20,20,28,.9);z-index:3;
}
.appicon .badge.plain{min-width:10px;height:10px;padding:0}
.appicon.locked{pointer-events:auto}
.appicon.locked .ico{filter:grayscale(.85) brightness(.5);pointer-events:none}
.appicon.locked .ico::after{
  content:'🔒';position:absolute;font-size:19px;filter:none;
}
.appicon.locked .ico > *{visibility:hidden}
/* Dock：与网格严格区分（更大圆角、含文字标签），占据底部固定一栏 */
.dock{
  margin-top:auto;display:flex;gap:16px;justify-content:center;align-items:flex-start;
  background:rgba(255,255,255,.11);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:26px;padding:12px 18px 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.11);
}
/* 图标群与 Dock 之间加一段弹性留白。留白有上限，超出部分由"记录条"吸收 */
.desk-spacer{flex:1 1 auto;min-height:30px;max-height:96px}
/* 记录条：把中部空白变成一句有用的状态提示，避免大片纯空 */
.desk-note{
  flex:0 0 auto;margin:2px 2px 16px;padding:10px 14px;
  background:rgba(255,255,255,.075);border-radius:14px;
  font-size:11.8px;color:rgba(255,255,255,.62);line-height:1.6;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
}
.desk-note b{color:rgba(255,255,255,.86)}
.dock .appicon{gap:6px}
.dock .ico{width:52px;height:52px;border-radius:15px;font-size:24px}
.dock .lbl{display:block;font-size:10.6px;opacity:.9;max-width:60px}
.home-indicator{
  position:absolute;left:50%;transform:translateX(-50%);bottom:8px;width:134px;height:5px;border-radius:3px;
  background:rgba(0,0,0,.32);z-index:850;
  cursor:pointer;pointer-events:auto;
}
/* 扩大可点区域（视觉仍是 5px 细条），避免误点不到 */
.home-indicator::before{
  content:'';position:absolute;left:-50px;right:-50px;top:-18px;bottom:-14px;
}
.home-indicator.light{background:rgba(255,255,255,.55)}

/* ============ 提示 / 任务条 ============ */
.taskbar{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:700;
  background:rgba(28,28,36,.93);backdrop-filter:blur(14px);
  color:#fff;border-radius:14px;padding:11px 14px;font-size:12.8px;line-height:1.5;
  display:flex;gap:9px;align-items:flex-start;
  box-shadow:0 10px 26px rgba(0,0,0,.34);
  animation:toastIn .3s cubic-bezier(.2,1.1,.3,1);
  pointer-events:none;
}
.taskbar.toast{pointer-events:none}
.taskbar b{color:#ffd66b}
.taskbar .ico-b{flex:0 0 auto;font-size:14px;line-height:1.4}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* 通用弹窗 */
.modal{
  position:absolute;inset:0;z-index:880;display:flex;align-items:center;justify-content:center;padding:26px;
  background:rgba(10,10,16,.5);backdrop-filter:blur(5px);
  animation:fade .2s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal .box{
  width:100%;max-width:300px;background:#fff;border-radius:20px;padding:22px 20px 16px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.15,.3,1);
  max-height:76%;overflow-y:auto;
}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal .box h3{margin:0 0 10px;font-size:17px;font-weight:700;text-align:center}
.modal .box .body{font-size:13.6px;line-height:1.72;color:#4a4a53}
.modal .box .body .em{color:var(--accent);font-weight:700}
.modal .acts{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.btn{
  width:100%;height:46px;border-radius:12px;font-size:15px;font-weight:600;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .13s,opacity .13s;
}
.btn:active{transform:scale(.975);opacity:.88}
.btn.ghost{background:#f1f1f5;color:#3a3a42}
.btn.dark{background:#22222a}
.btn.danger{background:#c0392b;color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

/* 引导高亮 */
.guide{
  position:absolute;z-index:870;border-radius:14px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(8,8,14,.62),0 0 0 2px #ffd66b,0 0 22px rgba(255,214,107,.7);
  animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 9999px rgba(8,8,14,.62),0 0 0 2px #ffd66b,0 0 20px rgba(255,214,107,.55)}50%{box-shadow:0 0 0 9999px rgba(8,8,14,.62),0 0 0 3px #ffd66b,0 0 30px rgba(255,214,107,.9)}}
.guide-tip{
  position:absolute;z-index:872;background:#ffd66b;color:#33270a;font-size:12.4px;font-weight:700;
  padding:7px 12px;border-radius:9px;white-space:nowrap;pointer-events:none;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}

/* ============ 平台通用：帖子 ============ */
.pf-header{
  flex:0 0 auto;padding:8px 14px 9px;background:#fff;border-bottom:1px solid var(--line);
  position:relative;z-index:20;
}
.pf-row1{display:flex;align-items:center;gap:9px}

/* ============ 启动页 ============ */
.splash{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:

    radial-gradient(700px 560px at 92% 22%,#8a3f5c 0%,transparent 58%),

  overflow-y:auto;overflow-x:hidden;

  overscroll-behavior:contain;

.splash .sp-inner{
  display:flex;flex-direction:column;min-height:100%;

}
.splash .sp-top{flex:0 0 auto;padding-top:52px}
.splash .sp-kicker{
  display:inline-block;font-size:11.6px;letter-spacing:3.4px;color:#e8a5bb;
  border:1px solid rgba(232,165,187,.42);border-radius:20px;padding:6px 15px;
}
.splash .sp-title{
  font-size:38px;font-weight:800;letter-spacing:5px;line-height:1.26;margin:22px 0 0;
  text-shadow:0 4px 26px rgba(232,67,122,.4);
}
.splash .sp-sub{font-size:13.4px;color:#a9a4b8;letter-spacing:1.6px;margin-top:12px}
.splash .sp-line{
  width:52px;height:2px;border-radius:2px;margin:22px auto 0;
  background:linear-gradient(90deg,transparent,#e8437a,transparent);
}
.splash .sp-intro{
  flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;
  font-size:14px;line-height:1.95;color:#cfc9dd;text-align:left;
  max-width:290px;margin:0 auto;padding:20px 0;
}
.splash .sp-intro p{margin:0 0 14px}
.splash .sp-intro .hl{color:#f0b9cb}
.splash .sp-foot{flex:0 0 auto;padding-bottom:38px}
.splash .sp-note{font-size:10.8px;color:#6f6a80;line-height:1.65;margin-top:15px}
.splash .sp-continue{
  background:none;color:#a9a4b8;font-size:12.6px;margin-top:13px;

}

.splash .sp-anim{animation:fadeUp .7s cubic-bezier(.2,.9,.3,1) both}

.splash .sp-anim.d2{animation-delay:.18s}

  function get(key){
    if(cache[key]) return cache[key];
    let v;

    else if(/^gen(\d+)$/.test(key)) v = wrap(generic(parseInt(key.slice(3),10)));

    cache[key]=v; return v;
  }

function openHintPop(){
  $$('.hintpop').forEach(n=>n.remove());
  const lv = Math.max(1, Math.min(S.hintLevel||0, 3) || 1);
  const h = HINTS[S.stage];
  if(!h) return;
  const tips = [h.l1, h.l2, h.l3].filter(Boolean);
  const p = document.createElement('div');
  p.className = 'hintpop';
  p.onclick = e=>e.stopPropagation();
  p.innerHTML = `
    <div class="hp-h"><span>💡</span><span>提示 ${lv}/${tips.length}</span></div>
    <div class="hp-b">${tips[lv-1]}</div>
    <div class="hp-acts">
      ${lv<tips.length
        ? `<button class="pri" data-hint="more">还看不出来，再提示一点</button>`
        : `<button class="pri" data-hint="close">明白了</button>`}
      <button data-hint="close">收起</button>
    </div>`;
  p.querySelectorAll('[data-hint]').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.hint==='more'){ S.hintLevel = lv+1; save(); openHintPop(); }
      else { p.remove(); }
    };
  });
  $('#screen').appendChild(p);
}

function render(){

  }

let toastTimer = null;

function showModal(innerHTML, opts={}){
  const m = modalNode(`<div class="body">${innerHTML}</div>`, opts.cls||'');

    title,
    actions:[
      { label:okLabel, onClick:onOk },

}

/* ---------- 引导高亮 ---------- */
function highlight(selector, text, opts={}){
  clearHighlight();
  const el = typeof selector==='string' ? $(selector) : selector;
  if(!el) return;
  const scr = $('#screen').getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const box = document.createElement('div');
  box.className = 'guide';
  box.style.left = (r.left-scr.left-5)+'px';
  box.style.top  = (r.top-scr.top-5)+'px';
  box.style.width = (r.width+10)+'px';
  box.style.height = (r.height+10)+'px';
  box.dataset.guide='1';
  const tip = document.createElement('div');
  tip.className='guide-tip';
  tip.dataset.guide='1';
  tip.textContent = text;
  $('#screen').appendChild(box);
  $('#screen').appendChild(tip);
  requestAnimationFrame(()=>{
    const tw = tip.offsetWidth;
    let left = r.left-scr.left + r.width/2 - tw/2;
    left = Math.max(10, Math.min(left, scr.width-tw-10));
    tip.style.left = left+'px';
    let top = r.top-scr.top - 40;
    if(top < 56) top = r.top-scr.top + r.height + 12;
    tip.style.top = top+'px';
  });
  if(opts.autoClear!==false) setTimeout(clearHighlight, opts.ms||5200);
}
function clearHighlight(){ $$('[data-guide]').forEach(n=>n.remove()); }

    </div>`;
  v.querySelector('.v-close').onclick = ()=>{ v.remove(); if(opts.onClose) opts.onClose(); };
  v.querySelector('#vSave').onclick = ()=>{

function postNode(p){
  const imgs = (p.imgs||[]).map(im=>{
    const done = im.savedKey && S.evidence[im.savedKey];
    return `<div class="p-img ${im.wide?'wide':''}" data-img="${im.key}">
      <img src="${IMG.get(im.key)}" style="width:100%;height:100%;object-fit:cover">
      ${im.savedKey?`<span class="saveflag ${done?'done':''}">${done?'已存':'可保存'}</span>`:''}

  }).join('');
  const grid = (p.imgs&&p.imgs.length>1)?`g${Math.min(p.imgs.length,3)}`:'g1';
  const cms = (p.cms&&p.cms.length)
    ? `<div class="p-cms">${p.cms.map(c=>`<div class="c">💬 <b>@${esc(c[0])}</b>：${esc(c[1])}</div>`).join('')}</div>`

    ? `<div class="c byidol">💬 <b>@${esc(p.reply[0])}</b>：${esc(p.reply[1])}</div>`
    : '';
  return `<div class="post" ${p.postId?`data-post="${p.postId}"`:''}>
    <div data-avatar="${p.avatarId||''}">${p.avatarHTML}</div>
    <div class="p-main">
      <div class="p-name">${esc(p.name)}${p.verified?`<span class="${p.verified==='vip'?'vip':'v'}">${p.verified==='vip'?'VIP':'V'}</span>`:''}</div>

      <div class="p-text">${p.text}</div>
      ${cms}${rep}
      ${p.imgs&&p.imgs.length?`<div class="p-imgs ${grid}">${imgs}</div>`:''}
      <div class="p-bar"><span>↻ ${p.reposts||'—'}</span><span>💬 ${p.comments||'—'}</span><span>♡ ${p.likes||'—'}</span></div>
    </div>

}

/* APP 菜单面板 */

    { label:'回桌面', act:()=>{ closeSheet(); NAV.stack=[]; go('desktop'); } },
    { label:'记录', act:()=>{ closeSheet(); NAV.stack=[]; go('note'); } }
  ];
  const s = document.createElement('div');
  s.className = 'sheet';

  });

/* =====================================================================
   【顶部下拉通知横幅】—— 模拟手机系统消息通知
   —— 从屏幕顶部滑入，短暂停留后自动收起；点击可进入对应 APP
   —— 玩家已在对应聊天页时不重复弹出
   ===================================================================== */
let notifTimer = null;
function showNotif(opts){
  const { app, title, body, ico='满', bg='linear-gradient(160deg,#5fd68f,#33a866)', tone='微讯', ms=4200 } = opts;
  /* 已在目标 APP 内不打断阅读 */
  if(S.app === app && opts.skipIfInApp !== false) return;
  $$('.notif').forEach(n=>n.remove());
  clearTimeout(notifTimer);
  const n = document.createElement('div');
  n.className = 'notif';
  n.innerHTML = `
    <div class="nf-av" style="background:${bg}">${esc(ico)}</div>
    <div class="nf-main">
      <div class="nf-t">${esc(title)}<span>${esc(tone)}</span></div>
      <div class="nf-b">${body}</div>
    </div>
    <div class="nf-app">现在</div>`;
  n.onclick = ()=>{
    hideNotif();
    if(opts.onOpen) opts.onOpen();
    else { NAV.stack = []; go(app); }
  };
  $('#screen').appendChild(n);
  requestAnimationFrame(()=> requestAnimationFrame(()=> n.classList.add('in')));
  notifTimer = setTimeout(hideNotif, ms);
}
function hideNotif(){
  $$('.notif').forEach(n=>{
    n.classList.remove('in');
    setTimeout(()=> n.remove(), 400);
  });
}
/* 闺蜜（林小满）专用通知 */
function notifBestie(body, opts={}){
  showNotif({ app:'wechat', title:'林小满', body, ico:'满', tone:'微讯', ...opts });
}

/* =====================================================================
   【跨 APP 剪贴板】
   —— 所有平台共用一份内部 clipboard，跨 APP 保留，写入存档
   ===================================================================== */
function copyText(text, label){
  S.clip = { text:String(text), at:Date.now() };
  if(!S.searches[S.app]) S.searches[S.app] = [];
  save();
  /* 尽力写系统剪贴板，失败不影响主线（权限被拒是常见情况） */
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      const p = navigator.clipboard.writeText(String(text));
      if(p && p.catch) p.catch(()=>{});
    }
  }catch(e){}
  toast('已复制：' + (label || text));
  /* 广播：各页面按需响应（不依赖 DOM 事件顺序） */
  try{ if(typeof onClipboardChange==='function') onClipboardChange(String(text)); }catch(e){}
}
/* 各 APP 按需覆写：默认无操作 */
function onClipboardChange(text){
  if(text === CFG.musicId && !S.flags.musicNumCopied){
    S.flags.musicNumCopied = true;
    if(S.stage<3) unlockStage(3);
    save();
  }
  if(text === CFG.girlXhsUid && !S.flags.girlUidCopied){
    S.flags.girlUidCopied = true;
    if(S.stage<4) unlockStage(4);
    save();
  }
  if(text === CFG.girlOldNick && !S.flags.wbOldNickCopied){
    S.flags.wbOldNickCopied = true;
    save();
  }
}
/* 其他页面复制候选人（旧昵称）时也走这里 */
function clipMatches(v){ return clipText() === v; }
function clipText(){ return (S.clip && S.clip.text) || ''; }
/* 最近搜索记录 */
function pushSearch(app, q, ok, target){
  if(!S.searches[app]) S.searches[app] = [];
  S.searches[app] = [{ q, ok:!!ok, target:target||'', at:Date.now() },
                     ...S.searches[app].filter(x=>x.q!==q)].slice(0,6);
  save();
}
/* 可复制文本节点：点击弹出上下文菜单 */
function copyable(text, label, cls=''){
  return `<span class="copyable ${cls}" data-copy="${esc(text)}" data-copylbl="${esc(label||text)}">${esc(label||text)}</span>`;
}
/* 绑定所有 [data-copy]：点击 → 上下文菜单（至少含"复制"） */
function bindCopyable(root){
  $$('[data-copy]', root).forEach(n=>{
    n.style.cursor = 'pointer';
    n.onclick = e=>{
      e.stopPropagation();
      openCtxMenu(e, n.dataset.copy, n.dataset.copylbl);
    };
  });
}
function openCtxMenu(e, text, label){
  closeSheet();
  const m = document.createElement('div');
  m.className = 'ctxmenu';
  m.innerHTML = `<button class="ctx-item" data-cx="copy">复制</button>
                 <button class="ctx-item cancel" data-cx="cancel">取消</button>`;
  const scr = $('#screen').getBoundingClientRect();
  const x = (e && e.clientX ? e.clientX : scr.width/2) - scr.left;
  const y = (e && e.clientY ? e.clientY : scr.height/2) - scr.top;
  m.style.left = Math.max(8, Math.min(x - 40, scr.width - 130)) + 'px';
  m.style.top  = Math.max(60, y + 8) + 'px';
  m.addEventListener('click', ev=>{
    const b = ev.target.closest('[data-cx]');
    if(!b) return;
    if(b.dataset.cx==='copy'){ copyText(text, label); }
    closeSheet();
  });
  $('#screen').appendChild(m);
  setTimeout(()=>{
    const h = ev=>{ if(!m.contains(ev.target)){ closeSheet(); document.removeEventListener('pointerdown', h, true); } };
    document.addEventListener('pointerdown', h, true);
  }, 60);
}

/* =====================================================================
   【搜索面板】
   —— 点击搜索框弹出；玩家必须主动粘贴/选择候选，再点搜索
   —— 绝不自动把剪贴板内容当成已搜索结果
   ===================================================================== */
function openSearchPanel(opts){
  const { app, hint='搜索什么内容', onSearch, readyText='' } = opts;
  closeSheet();
  const s = document.createElement('div');
  s.className = 'sheet search';
  const clip = clipText();
  const hist = (S.searches[app]||[]).slice(0,4);
  s.innerHTML = `<div class="sheet-box">
    <div class="sp-head">
      <div class="sp-q">${esc(hint)}</div>
      <button class="sp-cancel" data-sp="cancel">取消</button>
    </div>
    <div class="sp-input">
      <span class="sp-ico">🔍</span>
      <input id="spField" type="text" placeholder="输入或粘贴要搜索的内容" value="${esc(readyText)}">
      <button class="sp-paste" data-sp="paste">粘贴</button>
    </div>
    <div class="sp-sub">当前剪贴板</div>
    ${clip
      ? `<button class="sp-clip" data-sp="useclip"><span class="sp-clip-t">${esc(clip)}</span><span class="sp-clip-go">点击填入 ›</span></button>`
      : `<div class="sp-empty">（剪贴板是空的。先去别的地方复制一段内容。）</div>`}
    ${hist.length?`<div class="sp-sub">最近搜索</div>
      <div class="sp-hist">${hist.map((h,i)=>`<button class="sp-chip" data-sp="hist" data-i="${i}">${esc(h.q)}</button>`).join('')}</div>`:''}
    ${opts.suggest&&opts.suggest.length?`<div class="sp-sub">搜索发现</div>
      <div class="sp-hist">${opts.suggest.map((g,i)=>`<button class="sp-chip sug" data-sp="sug" data-i="${i}">${esc(g.label)}</button>`).join('')}</div>`:''}
    <button class="btn sp-go" data-sp="go">搜索</button>
  </div>`;

  const field = s.querySelector('#spField');
  const doSearch = ()=>{
    const q = (field.value||'').trim();
    if(!q){ toast('先输入或粘贴要搜索的内容。'); return; }
    closeSheet();
    onSearch(q);
  };
  s.addEventListener('click', ev=>{
    const b = ev.target.closest('[data-sp]');
    if(!b){ if(ev.target===s) closeSheet(); return; }
    const k = b.dataset.sp;
    if(k==='cancel') closeSheet();
    else if(k==='paste'){ field.value = clipText(); field.focus(); }
    else if(k==='useclip'){ field.value = clipText(); field.focus(); }
    else if(k==='hist'){ field.value = (S.searches[app]||[])[+b.dataset.i].q; field.focus(); }
    else if(k==='sug'){ field.value = opts.suggest[+b.dataset.i].value; field.focus(); }
    else if(k==='go') doSearch();
  });
  field.addEventListener('keydown', ev=>{ if(ev.key==='Enter') doSearch(); });
  $('#screen').appendChild(s);
  setTimeout(()=>{ try{ field.focus(); }catch(e){} }, 80);
}
/* 搜索结果页：统一渲染（无结果 / 无关结果 / 命中） */
function searchResultNode(opts){
  const { title, q, items, note, like } = opts;
  return `<div class="sr-wrap">
    <div class="sr-bar">搜索：<b>${esc(q)}</b></div>
    ${like?`<div class="sr-like">${esc(like)}</div>`:''}
    ${note?`<div class="sr-note">${note}</div>`:''}
    ${items.length
      ? items.map(it=>`
        <div class="sr-item ${it.hit?'hit':''}" ${it.key?`data-sritem="${esc(it.key)}"`:''}>
          <div class="sr-av" style="background:${it.bg||'#ececf2'};color:${it.fg||'#8b8b96'}">${esc(it.ico||'搜')}</div>
          <div class="sr-main">
            <div class="sr-t">${esc(it.title)}</div>
            <div class="sr-s">${it.sub||''}</div>
          </div>
          ${it.hit?'<span class="sr-tag">相关</span>':''}
        </div>`).join('')
      : `<div class="sr-none">没有找到相关内容。</div>`}
    <div style="height:20px"></div>
  </div>`;
}

      closeModal();
      $$('.viewer').forEach(n=>n.remove());
      $$('.hintpop').forEach(n=>n.remove());
      NAV.stack = [];
      go('desktop');
    };
  });
  /* 底部三级导航 + 可复制文本 */
  bindBottomNav(root, menuOpts);
  bindCopyable(root);
}

     搜索旧昵称 → 多条结果（含无关）→ 找到别人 @ 该旧昵称的微博
     → 点旧账号显示「用户不存在」→ 返回原微博 → 点改名后的账号 → 女方主页。
     任何跳转都必须玩家主动点击，绝不自动完成。 */
  const sbtn = $('[data-wbsearch]', w);
  if(sbtn){
    sbtn.onclick = ()=>{
      openSearchPanel({
        app:'weibo',
        hint:'搜索微博 / 用户',
        suggest:[
          { label:CFG.people.idol.name, value:CFG.people.idol.name },   // 无关
          { label:CFG.musicId,          value:CFG.musicId },            // 无关
          { label:CFG.girlXhsUid,       value:CFG.girlXhsUid },         // 无关
          { label:'巡演闭幕',            value:'巡演闭幕' }              // 无关
        ],
        onSearch:(q)=>{
          const hit = wbSearchHit(q);
          pushSearch('weibo', q, hit, hit?'wbresult':'');
          S.flags.wbSearchMiss = q;
          S.flags.weiboSearchDone = true;
          sbtn.innerHTML = `🔍 ${q}`;
          sbtn.classList.add('typed');
          save();
          push('wbresult');
        }
      });
    };
  }
  /* ---------- 搜索结果页：点击别人 @ 旧昵称的那条微博 ---------- */
  if(v==='wbresult'){
    $$('[data-sritem]', w).forEach(n=>{
      n.style.cursor='pointer';
      n.onclick = ()=>{
        if(!S.flags.wbOldPostRead) push('wbpost');
      };
    });
    bindCopyable(w);
  }
  /* ---------- 那条微博的详情 / 评论区 ---------- */
  if(v==='wbpost'){
    S.flags.wbOldPostRead = true; save();
    /* 点击被 @ 的旧账号 → 「用户不存在」页（不解锁任何证据） */
    $$('[data-wbold]', w).forEach(n=>{
      n.style.cursor='pointer';
      n.onclick = e=>{
        e.stopPropagation();
        S.flags.wbOldAcctSeen = true; save();
        push('wbgone');
      };
    });
    /* 点击改名后的账号 → 女方小号主页（这一步才算真正发现账号） */
    $$('[data-wbnow]', w).forEach(n=>{
      n.style.cursor='pointer';
      n.onclick = e=>{
        e.stopPropagation();
        if(S.flags.wbOldAcctSeen){
          S.flags.weiboSearchDone = true; save();
          push('girlprofile');
        }else{
          toast('先点一下上面那个被 @ 的旧账号看看。');
        }
      };
    });
  }
  /* ---------- 「用户不存在」页：可原路返回 ---------- */
  if(v==='wbgone'){
    S.flags.wbOldAcctSeen = true;
    $$('[data-wbback]', w).forEach(n=>{
      n.style.cursor='pointer';
      n.onclick = ()=>{ popTo(NAV.stack.length-1); };
    });
  }

  /* 帖子图片：普通预览，不做任何伏笔提示 */
  bindImages(w, (key)=>{
    openViewer({ src:IMG.get(key), title:'图片预览', caption:'普通内容，不影响主线。' });
  });

  /* 开场引导：只高亮一次站姐那条微博的头像，不写命令句 */
  if(S.stage===0 && S.started && !S.flags.weiboStanSeen && v!=='idol' && v!=='stan' && !S.flags.guideWeibo){
    S.flags.guideWeibo = true; save();
    requestAnimationFrame(()=> highlight('.post[data-post="f0"] [data-avatar="stanHead"]', '这条微博有点奇怪'));
  }
  return w;
}

function wxBubble(side, html){

function wxChatHTML(){

  if(S.flags.wxReplied){

    base.push(wxBubble('them','我也不知道。昨晚刷微博的时候还看到她发了一条动态，感觉怪怪的。'));

      base.push(wxBubble('them','我也没看懂她在说谁。'));

function renderWxReplies(w){
  const box = $('#wxReply', w);
  if(!box) return;

  /* 第一步：玩家必须先回复 */
  if(!S.flags.wxReplied){
    box.innerHTML = `<div class="hintline">回复她</div>
      <button class="opt" id="wxReplyBtn"><span class="num">1</span>看到了，怎么突然这样？</button>`;
    $('#wxReplyBtn', w).onclick = ()=>{
      S.flags.wxReplied = true; save();
      rerenderWx();
      /* 闺蜜随即发来新消息 —— 若玩家不在微讯页则弹通知 */
      setTimeout(()=>{
        if(S.app!=='wechat' && !S.flags.wxNotif2){
          S.flags.wxNotif2 = true; save();
          notifBestie('我点进去的时候还在，刷新一下就没了。幸好我手快截了图。', {
            onOpen:()=>{ NAV.stack=[]; go('wechat'); }
          });
        }
      }, 700);
    };
    return;
  }

  /* 第二步：必须点开截图并保存 */
  if(!S.evidence.screenshot){
    box.innerHTML = `<div class="hintline">她发来了一张截图</div>
      <button class="opt" id="openShot"><span class="num">↗</span>点开这张截图</button>`;
    $('#openShot', w).onclick = ()=> openShotViewer();
    return;
  }

  /* 第三步：对话结束 */
  box.innerHTML = `<div class="hintline">对话已结束</div>
    <button class="opt" id="wxDone">我去别的地方看看</button>`;
  $('#wxDone', w).onclick = ()=>{
    if(S.stage < 2) unlockStage(2);
    save();
    showModal(`
      <div style="font-size:13.4px;line-height:1.8;color:#4a4a53">
        你决定先从公开讨论里找找线索。
        <div style="margin-top:12px;padding:11px 12px;background:#fdeef5;border-radius:11px;color:#c0396b;font-size:12.8px">
          解锁：<b>吃瓜小组</b>。
        </div>
      </div>`, {
      title:'接下来',
      actions:[{ label:'知道了', onClick:closeModal }]
    });
  };
}
function rerenderWx(){
  const vp = $('#viewport');
  if(!vp) return;
  /* 保留滚动位置感：直接重绘当前微信页 */
  const w = APP_RENDER.wechat();
  vp.innerHTML=''; vp.appendChild(w);
}
function openShotViewer(){
  openViewer({
    src: IMG.get('screenshot'),
    title:'星河不落 · 截图',
    caption:'仅好友可见<br>你截屏的时间：2026-09-29 02:14<br><br>文案：以后可能不会再来这里了。有些事，知道了也没用。',
    saveLabel:'保存图片',
    onSave:()=>{
      /* 唯一完成条件：点击“保存图片” */
      if(!S.evidence.screenshot){

        save();
      }
    },
    onAfter:()=>{
      S.flags.wxShotSent = true;
      if(S.stage<2) unlockStage(2);
      save();
      rerenderWx();
    }
  });
}

  bindNav(w);

  if(v==='thread'){
    const dv = $('[data-avatar="doubtHead"]', w);
    if(dv){
      dv.style.cursor='pointer';

      if(S.stage<3) unlockStage(3);
      save();
      toast('这串数字，像是音乐平台里的用户编号。');
    };
  }
  if(!v || v==='') {
    /* 每一条帖子都可点击进入详情 */
    $$('[data-thread]', w).forEach(n=>{
      n.style.cursor = 'pointer';
      n.onclick = ()=>{

        if(id==='target'){ save(); push('thread'); }
        else { S.flags['bbsSeen_'+id] = true; save(); push('post:'+id); }

    });
  }
  return w;
}

    <div class="editor-bar">
      <div class="editor-tools">
        ${ED.layers.map(l=>`<button class="tool ${ED.sel===l.id?'on':''}" data-pick="${l.id}">${l.id==='L1'?'女方照片':'偶像自拍'}</button>`).join('')}
        ${canAlign?`<button class="tool" data-align="1">⚙ 一键对齐</button>`:''}
        ${canAlign?`<button class="tool auto" data-auto="1">🔍 自动识别重叠</button>`:''}
      </div>
      <div class="slider-row"><span style="width:44px">缩放</span><input type="range" id="edScale" min="20" max="140" value="${Math.round(cur().w*100)}"><span id="edScaleV" style="width:36px;text-align:right">${Math.round(cur().w*100)}%</span></div>
      <div class="slider-row"><span style="width:44px">旋转</span><input type="range" id="edRot" min="-180" max="180" value="${Math.round(cur().rot)}"><span id="edRotV" style="width:36px;text-align:right">${Math.round(cur().rot)}°</span></div>
      <div class="slider-row" style="margin-bottom:11px"><span style="width:44px">透明度</span><input type="range" id="edOp" min="10" max="100" value="${Math.round(cur().op*100)}"><span id="edOpV" style="width:36px;text-align:right">${Math.round(cur().op*100)}%</span></div>
      <button class="btn" id="edSave" ${(!S.evidence.xhsHand||!S.evidence.watch)&&!S.flags.overlaySaved?'disabled':''}>
        ${S.flags.overlaySaved?'已保存 · 重新保存':'保存叠图结果'}</button>
    </div>`;
  bindNav(w);
  syncEditor(w);
  bindEditor(w);
  return w;
}
function cur(){ return ED.layers.find(l=>l.id===ED.sel); }
function syncEditor(w){
  ED.layers.forEach(l=>{
    const n = $(`[data-layer="${l.id}"]`, w);
    if(!n) return;
    n.style.left = (l.x*100)+'%';
    n.style.top  = (l.y*100)+'%';
    n.style.width= (l.w*100)+'%';
    n.style.transform = `rotate(${l.rot}deg)`;
    n.style.opacity = l.op;
    n.classList.toggle('sel', ED.sel===l.id);
  });
  const c = cur();
  const sn = $('#edSelName', w); if(sn) sn.textContent = ED.sel==='L1'?'正在调整：女方照片':'正在调整：偶像自拍';
  const ss=$('#edScale',w), rr=$('#edRot',w), oo=$('#edOp',w);
  if(ss){ ss.value = Math.round(c.w*100); $('#edScaleV',w).textContent = Math.round(c.w*100)+'%'; }
  if(rr){ rr.value = Math.round(c.rot); $('#edRotV',w).textContent = Math.round(c.rot)+'°'; }
  if(oo){ oo.value = Math.round(c.op*100); $('#edOpV',w).textContent = Math.round(c.op*100)+'%'; }
  $$('[data-pick]', w).forEach(b=>b.classList.toggle('on', b.dataset.pick===ED.sel));
}
function bindEditor(w){
  $$('[data-pick]', w).forEach(b=> b.onclick = ()=>{ ED.sel = b.dataset.pick; syncEditor(w); });

  const st = $('#edStage', w);
  st.addEventListener('pointerdown', e=>{
    const ln = e.target.closest('.layer');
    if(ln){ ED.sel = ln.dataset.layer; }
    else { ED.sel = ED.sel==='L1'?'L2':'L1'; }
    const c = cur();
    ED.dragging = true;
    ED.sx = e.clientX; ED.sy = e.clientY; ED.ox = c.x; ED.oy = c.y;
    st.setPointerCapture(e.pointerId);
    syncEditor(w);
  });
  st.addEventListener('pointermove', e=>{
    if(!ED.dragging) return;
    const c = cur();
    const rect = st.getBoundingClientRect();
    c.x = ED.ox + (e.clientX-ED.sx)/rect.width;
    c.y = ED.oy + (e.clientY-ED.sy)/rect.height;
    ED.moved = true;
    syncEditor(w);
  });
  st.addEventListener('pointerup', ()=>{ ED.dragging=false; });
  st.addEventListener('pointercancel', ()=>{ ED.dragging=false; });

  const ss=$('#edScale',w), rr=$('#edRot',w), oo=$('#edOp',w);
  if(ss) ss.oninput = ()=>{ ED.layers.find(l=>l.id===ED.sel).w = +ss.value/100; ED.moved=true; syncEditor(w); };
  if(rr) rr.oninput = ()=>{ ED.layers.find(l=>l.id===ED.sel).rot = +rr.value; ED.moved=true; syncEditor(w); };
  if(oo) oo.oninput = ()=>{ ED.layers.find(l=>l.id===ED.sel).op = +oo.value/100; ED.moved=true; syncEditor(w); };

  const al = $('[data-align]', w);
  if(al) al.onclick = ()=>{
    ED.layers = [
      { id:'L2', key:'selfie',  x:0.19, y:0.08, w:0.60, rot:0, op:0.55, name:'' },
      { id:'L1', key:'xhsHand', x:0.19, y:0.08, w:0.60, rot:0, op:0.55, name:'' }
    ];
    ED.sel='L2'; ED.aligned = true; ED.moved = true;
    syncEditor(w);
    toast('已按表盘位置自动对齐');
  };

  /* 一键自动识别重叠：直接把两张图叠合，并判定证据收集成功 */
  const au = $('[data-auto]', w);
  if(au) au.onclick = ()=>{
    if(!S.evidence.xhsHand || !S.evidence.watch){ toast('素材还差一张。'); return; }
    au.disabled = true;
    au.innerHTML = `<span class="spinner"></span> 正在识别…`;
    setTimeout(()=>{
      ED.layers = [
        { id:'L2', key:'selfie',  x:0.185, y:0.075, w:0.61, rot:0, op:0.5 },
        { id:'L1', key:'xhsHand', x:0.185, y:0.075, w:0.61, rot:0, op:0.5 }
      ];
      ED.sel = 'L2'; ED.aligned = true; ED.moved = true;
      syncEditor(w);
      finishOverlay();
    }, 900);
  };

  function finishOverlay(){
    S.flags.overlaySaved = true;
    if(!S.evidence.overlay) gain('overlay');
    save();
    showModal(`
      <div style="text-align:center">
        <div style="width:120px;height:120px;margin:0 auto 12px;border-radius:14px;overflow:hidden;position:relative;background:#111">
          <img src="${IMG.get('selfie')}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5">
          <img src="${IMG.get('xhsHand')}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5">
        </div>
        <div style="font-size:13.4px;line-height:1.78;color:#4a4a53;text-align:left">
          你把两张图叠在一起，一点点挪动。<br><br>
          表盘的位置、表冠的朝向、钢带的收窄弧线——重合度很高。<br><br>
          至少从这两张照片能看到的细节来说，找不到明显差别。
        </div>
        <div style="margin-top:12px;padding:11px 12px;background:#f0fdf4;border-radius:11px;color:#1e7d4c;font-size:12.6px;text-align:left">
          ✅ 叠图结果已存入证据册。
        </div>
      </div>`, {
      title:'叠图结果',
      actions:[{ label:'回到桌面', onClick:()=>{ closeModal(); go('desktop'); } }]
    });
  }

  const sv = $('#edSave', w);
  if(sv) sv.onclick = ()=>{
    if((!S.evidence.xhsHand || !S.evidence.watch) && !S.flags.overlaySaved){
      toast('素材还差一张。'); return;
    }
    if(!ED.moved && !S.flags.overlaySaved){
      toast('先用「自动识别重叠」或手动挪一挪，让两张图对起来。');
      return;
    }
    finishOverlay();
  };
}

/* ---------- 启动 ---------- */
function boot(){
  /* URL 强制清档：index.html?reset=1 或 #reset —— 手机端最可靠的重置方式 */
  try{
    const u = location.href;
    if(/\?reset=1|#reset\b/.test(u)){
      __resetGameCore();
      try{ history.replaceState(null,'',location.pathname); }catch(e){}
      return;
    }
  }catch(e){}

  /* 旧存档兼容：老版本没有 splash 概念，读到旧档直接进桌面 */
  if(S.stage > 0 && !S.started){ S.started = true; S.app = 'desktop'; save(); }
  if(!S.app) S.app = 'splash';
  render();
}
